openapi: 3.1.0
info:
  title: RESILIENCE-ALPHA auth
  version: 0.1.0
  description: Authentification des utilisateurs et des services. Jetons JWT RS256.
servers:
  - url: /auth
paths:
  /v1/login:
    post:
      summary: Connexion d'un client
      description: |
        Réservée aux comptes clients. Un compte du back-office (rôle `admin`) ou un compte désactivé reçoit
        la même réponse `401` qu'un mauvais mot de passe, même avec le bon : le back-office ne se connecte
        que par `/v1/backoffice/login` (identifiant, visage, mot de passe).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Jeton émis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/backoffice/login:
    post:
      summary: Connexion du back-office, étape 1 - saisie de l'identifiant
      description: |
        Ouvre une tentative de connexion (valable 2 minutes, à usage unique : un visage, un mot de passe).
        Un identifiant inconnu, un client ou un compte désactivé reçoivent la même réponse `201` et
        échouent à l'étape du visage : on ne révèle pas quels comptes existent.

        Refusé (`423`) si l'identifiant est verrouillé (deux échecs de suite : 5 minutes, puis la durée
        double à chaque verrouillage, jusqu'à une heure) ou en attente après un refus (30 s après un visage
        refusé, 6 s après un mot de passe refusé). `Retry-After` n'est pas utilisé : lire
        `retry_after_seconds`.
      operationId: startBackofficeLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, maxLength: 254, examples: [admin@resilience.local] }
      responses:
        '201':
          description: Tentative ouverte (état `IDENTIFIED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackofficeLogin' }
        '422': { $ref: '#/components/responses/Problem' }
        '423':
          description: Identifiant verrouillé ou en attente (`reason` = `locked` ou `cooldown`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/backoffice/login/{id}:
    get:
      summary: État d'une tentative de connexion
      operationId: getBackofficeLogin
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: État courant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackofficeLogin' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /v1/backoffice/login/{id}/face:
    post:
      summary: Connexion du back-office, étape 2 - la photo
      description: |
        Corps binaire : une photo `image/jpeg` ou `image/png` de 1 Mo au plus. Le format est vérifié
        sur les premiers octets, pas seulement sur l'en-tête. La photo n'est pas conservée.

        Visage reconnu : état `PASSWORD_PENDING`, LED verte clignotante. Visage non reconnu : `401`,
        LED rouge fixe 30 s, la tentative est terminée (il faut ressaisir l'identifiant). Une panne du
        service de reconnaissance renvoie `503` et ne compte pas comme un échec.
      operationId: submitBackofficeFace
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Visage reconnu (état `PASSWORD_PENDING`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackofficeLogin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: |
            Visage non reconnu (`reason` = `face_not_recognized`). `retry_after_seconds` : délai avant de pouvoir
            recommencer (30 s, ou la durée du verrouillage si `locked` vaut `true`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RefusedStep' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/backoffice/login/{id}/password:
    post:
      summary: Connexion du back-office, étape 3 - le mot de passe
      description: |
        Seulement après un visage reconnu (`409` sinon). Un seul essai par tentative : un mot de passe
        refusé termine la tentative (LED rouge clignotante), il faut tout recommencer. Le jeton émis
        porte le rôle `admin` et `amr: [face, pwd]`.
      operationId: submitBackofficePassword
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: Connexion réussie, jeton émis (LED verte fixe 30 s)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/TokenResponse' }
                  - type: object
                    properties:
                      state: { type: string, const: GRANTED }
        '401':
          description: Mot de passe refusé (`reason` = `wrong_password`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RefusedStep' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/users:
    get:
      summary: Lister les comptes (habilitations)
      description: Rôle `admin`.
      operationId: listUsers
      responses:
        '200':
          description: Comptes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
    post:
      summary: Créer un compte
      description: Rôle `admin`. Un rôle de service (`svc:...`) ne peut pas être attribué ici.
      operationId: createAdminUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, roles]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true, minLength: 12 }
                roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [customer, operator, admin] }
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/users/{id}:
    patch:
      summary: Modifier les habilitations d'un compte
      description: |
        Rôle `admin`. On ne peut ni retirer le rôle `admin` ni désactiver le dernier administrateur actif,
        ni modifier ses propres habilitations (`403`).
      operationId: updateAdminUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [customer, operator, admin] }
                active: { type: boolean }
      responses:
        '200':
          description: Compte modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: Ce serait le dernier administrateur actif
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/users/{id}/face:
    post:
      summary: Enrôler un visage pour ce compte
      description: |
        Rôle `admin`. Corps binaire (`image/jpeg` ou `image/png`, 1 Mo au plus), comme pour la connexion.
        Enregistré sous l'email du compte, la clé utilisée à la connexion.
      operationId: enrollAdminUserFace
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Visage enrôlé
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    {
                      type: integer,
                      description: Échantillons conservés pour ce compte (5 au plus),
                    }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422':
          description: Photo invalide, ou aucun visage détecté
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/admin/lockouts/{identifier}:
    delete:
      summary: Débloquer un identifiant
      description: Rôle `admin`. Lève un verrouillage du back-office avant son échéance.
      operationId: unlockBackofficeIdentifier
      parameters:
        - { name: identifier, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Débloqué }
  /v1/devices/led:
    get:
      summary: État courant de la LED
      description: |
        État tel que publié par `auth` sur MQTT (`resilience/led`). Rôles `operator`, `svc:dashboard`, `admin`.
        L'ESP8266 ne l'appelle pas : il lit directement le broker.
      operationId: getLedState
      responses:
        '200':
          description: État
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    { type: string, enum: [off, green-blink, green-solid, red-blink, red-solid] }
                  since: { type: string, format: date-time }
                  until:
                    {
                      type: [string, 'null'],
                      format: date-time,
                      description: Quand la LED repassera à off,
                    }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/token:
    post:
      summary: Jeton de service (client credentials)
      operationId: serviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCredentials' }
      responses:
        '200':
          description: Jeton de service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/register:
    post:
      summary: Création d'un compte client fictif
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/me:
    get:
      summary: Profil de l'utilisateur courant
      operationId: me
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
  /.well-known/jwks.json:
    get:
      summary: Clés publiques de vérification (consommé par api-metier et remediation)
      operationId: jwks
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema: { type: object }
  /healthz:
    get:
      summary: Liveness
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Erreur (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true, minLength: 12 }
    ClientCredentials:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string, examples: [svc-detector] }
        client_secret: { type: string, writeOnly: true }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, examples: [900] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles:
          type: array
          items:
            {
              type: string,
              enum:
                [
                  customer,
                  operator,
                  admin,
                  'svc:detector',
                  'svc:dashboard',
                  'svc:remediation-canary',
                ],
            }
    BackofficeLogin:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        state:
          type: string
          enum: [IDENTIFIED, PASSWORD_PENDING, GRANTED, FACE_REFUSED, PASSWORD_REFUSED, EXPIRED]
        expires_at: { type: string, format: date-time }
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string, enum: [customer, operator, admin] } }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    RefusedStep:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            reason: { type: string, enum: [face_not_recognized, wrong_password] }
            retry_after_seconds: { type: integer, description: Délai avant de pouvoir recommencer }
            locked: { type: boolean, description: L'identifiant vient d'être verrouillé }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id: { type: string }
