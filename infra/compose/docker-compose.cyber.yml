# ==============================================================================
#  Pile CYBERSÉCURITÉ : WAF + SIEM (Wazuh complet)
#
#  docker compose -f docker-compose.cyber.yml up -d
#
#  Services :
#    - waf            : Nginx + ModSecurity + règles OWASP CRS
#    - wazuh-certs    : génération des certificats TLS (job unique)
#    - wazuh-indexer  : OpenSearch (stockage des alertes)
#    - wazuh-manager  : manager Wazuh (API, agents, alertes)
#    - wazuh-dashboard : interface web du SIEM
# ==============================================================================

name: resilience-alpha-cyber

services:

  # ---------- Entrée : WAF (Nginx + ModSecurity + règles OWASP CRS) ----------
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf
    restart: unless-stopped
    environment:
      MODSEC_RULE_ENGINE: 'On'
      PARANOIA: '1'
      # Les images faciales du back-office (base64 JSON) depassent la limite
      # "no files" par defaut (128 Ko). Nom EXACT de la variable de l'image :
      MODSEC_REQ_BODY_NOFILES_LIMIT: '10485760'
    ports:
      - '80:8080'     # front      -> banque client
      - '8081:8081'   # dashboard  -> supervision / remediation
      - '8082:8082'   # backoffice -> admin + MFA faciale
    volumes:
      # Routage par prefixe (remplace le routage mono-backend de l'image).
      - ./config/waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./config/waf/waf_api_routes.conf.template:/etc/nginx/templates/includes/waf_api_routes.conf.template:ro
      - ./config/waf/proxy_common.conf.template:/etc/nginx/templates/includes/proxy_common.conf.template:ro
      # Exclusion CRS ciblee (login back-office) via modsecurity-override.conf,
      # inclus inconditionnellement par l'image AVANT les regles CRS.
      - ./config/waf/modsecurity-override.conf:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      # Liste de blocage d'IP ecrite par la remediation (volume partage, externe).
      - waf_denylist:/etc/nginx/denylist:ro
    # L'image sonde https://localhost:8443/healthz par defaut ; on a retire le bloc SSL,
    # donc on sonde le /healthz HTTP sur le port front (8080).
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      logging: promtail
    networks: [backend, cyber]

  # ---------- Certificats TLS (job unique) ----------
  wazuh-certs:
    image: wazuh/wazuh-certs-generator:0.0.4
    container_name: wazuh-certs
    user: "0:0"
    restart: "no"
    environment:
      CERT_TOOL_VERSION: 4.14
    volumes:
      - wazuh_certs:/certificates
      - ./config/siem/certs.yml:/config/certs.yml:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rm -rf /certificates/wazuh-certificates
        if [ -f /certificates/root-ca.pem ] && [ -f /certificates/wazuh.indexer.pem ] && [ -f /certificates/wazuh.dashboard.pem ]; then
          echo "==> certificats deja presents dans le volume, generation ignoree"
        else
          rm -f /certificates/*
          /entrypoint.sh
        fi
        chmod 755 /certificates
        chmod 644 /certificates/*
        cp -f /certificates/root-ca.pem /certificates/root-ca-manager.pem
        cp -f /certificates/root-ca.key /certificates/root-ca-manager.key
        chmod 644 /certificates/root-ca-manager.pem /certificates/root-ca-manager.key
        echo "==> certificats prets dans /certificates"
    networks: [cyber]

  # ---------- Indexer (OpenSearch) ----------
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.9
    container_name: wazuh-indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - wazuh_certs:/usr/share/wazuh-indexer/config/certs:ro
      - ./config/siem/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/siem/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    ports:
      - '9200:9200'
    depends_on:
      wazuh-certs:
        condition: service_completed_successfully
    networks:
      cyber:
        aliases: [wazuh.indexer]

  # ---------- Manager ----------
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.9
    container_name: wazuh-manager
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /wazuh-certs/root-ca.pem
      SSL_CERTIFICATE: /wazuh-certs/wazuh.manager.pem
      SSL_KEY: /wazuh-certs/wazuh.manager-key.pem
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    ports:
      - '55000:55000'
      - '1514:1514'
      - '1515:1515'
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_api:/var/ossec/api/configuration
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - wazuh_certs:/wazuh-certs:ro
      - ./config/siem/manager:/wazuh-config-mount/etc:ro
    depends_on:
      wazuh-certs:
        condition: service_completed_successfully
      wazuh-indexer:
        condition: service_started
    networks:
      cyber:
        aliases: [wazuh.manager]

  # ---------- Dashboard ----------
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.9
    container_name: wazuh-dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      WAZUH_API_URL: https://wazuh.manager
      API_PORT: 55000
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
    volumes:
      - wazuh_certs:/usr/share/wazuh-dashboard/certs:ro
      - wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - ./config/siem/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    ports:
      - '5601:5601'
    depends_on:
      wazuh-certs:
        condition: service_completed_successfully
      wazuh-manager:
        condition: service_started
    networks:
      cyber:
        aliases: [wazuh.dashboard]

networks:
  backend: # partagé avec la pile dev (créé par la pile infra)
    name: resilience-alpha_backend
    external: true
  cyber:
    name: wazuh-net

volumes:
  waf_denylist: # ecrite par la remediation (pile dev), lue par le WAF
    name: resilience-alpha_waf_denylist
    external: true
  wazuh_certs:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_api:
  filebeat_etc:
  filebeat_var:
  wazuh_indexer_data:
  wazuh_dashboard_config: