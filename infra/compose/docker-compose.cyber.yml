# ==============================================================================
#  Pile CYBERSÉCURITÉ : WAF (point d'entrée unique)
#
#  docker compose -f docker-compose.cyber.yml up -d
#
#  Services :
#    - waf            : Nginx + ModSecurity + règles OWASP CRS
#
#  Le WAF est le seul point d'entrée de la plateforme : il expose les trois
#  fronts (banque, supervision, back-office) et route /auth/*, /api/* et
#  /remediation/* vers les services applicatifs.
#
#  La liste de blocage d'IP (volume resilience-alpha_waf_denylist) est écrite
#  par le moteur de remédiation (pile dev) et lue ici en lecture seule.
# ==============================================================================

name: resilience-alpha-cyber

services:

  # ---------- Entrée : WAF (Nginx + ModSecurity + règles OWASP CRS) ----------
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf
    restart: unless-stopped
    environment:
      MODSEC_RULE_ENGINE: 'On'
      PARANOIA: '1'
      # Les images faciales du back-office (base64 JSON) depassent la limite
      # "no files" par defaut (128 Ko). Nom EXACT de la variable de l'image :
      MODSEC_REQ_BODY_NOFILES_LIMIT: '10485760'
    ports:
      - '80:8080'     # front      -> banque client
      - '8081:8081'   # dashboard  -> supervision / remediation
      - '8082:8082'   # backoffice -> admin + MFA faciale
    volumes:
      # Routage par prefixe (remplace le routage mono-backend de l'image).
      - ./config/waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./config/waf/waf_api_routes.conf.template:/etc/nginx/templates/includes/waf_api_routes.conf.template:ro
      - ./config/waf/proxy_common.conf.template:/etc/nginx/templates/includes/proxy_common.conf.template:ro
      # Exclusion CRS ciblee (login back-office) via modsecurity-override.conf,
      # inclus inconditionnellement par l'image AVANT les regles CRS.
      - ./config/waf/modsecurity-override.conf:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      # Liste de blocage d'IP ecrite par la remediation (volume partage, externe).
      - waf_denylist:/etc/nginx/denylist:ro
    # L'image sonde https://localhost:8443/healthz par defaut ; on a retire le bloc SSL,
    # donc on sonde le /healthz HTTP sur le port front (8080).
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      logging: promtail
    networks: [backend]

networks:
  backend: # partagé avec la pile dev (créé par la pile infra)
    name: resilience-alpha_backend
    external: true

volumes:
  waf_denylist: # ecrite par la remediation (pile dev), lue par le WAF
    name: resilience-alpha_waf_denylist
    external: true
