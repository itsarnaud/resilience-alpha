# PROJECT RESILIENCE-ALPHA : pile CYBERSÉCURITÉ (WAF + SIEM)
# Lancement : docker compose -f docker-compose.cyber.yml up -d
# Prérequis : piles infra puis dev lancées (le WAF redirige vers "application").

name: resilience-alpha-cyber

services:
  # ---------- Entrée : WAF (Nginx + ModSecurity + règles OWASP CRS) ----------
  # Pas de depends_on vers "application" : elle est dans la pile dev
  # (depends_on ne fonctionne pas entre deux projets Compose).
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf
    restart: unless-stopped
    environment:
      BACKEND: http://application:3000 # tout le trafic passe par le WAF vers l'application
      PORT: '8080'
      MODSEC_RULE_ENGINE: 'On' # "DetectionOnly" pour seulement journaliser
      PARANOIA: '1'
      MODSEC_REQ_BODY_NO_FILES_LIMIT: '10485760' # 10 Mo : autorise l'image base64 de la reco faciale
    ports:
      - '80:8080'
    volumes:
      - ./config/waf/custom-before.conf:/etc/modsecurity.d/plugins/custom-before.conf:ro
    labels:
      logging: promtail
    networks: [frontend, backend]


networks:
  frontend: # exposé : seul le WAF y est (propre à cette pile)
    name: resilience-alpha_frontend
  backend: # applications entre elles (créé par la pile infra)
    name: resilience-alpha_backend
    external: true
  monitoring: # Prometheus, Loki, Grafana, Wazuh (créé par la pile infra)
    name: resilience-alpha_monitoring
    external: true

