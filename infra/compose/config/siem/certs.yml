nodes:
  # Noeuds a certifier : les noms doivent correspondre aux hostnames et aux
  # alias reseau utilises par le compose (wazuh.indexer / wazuh.manager /
  # wazuh.dashboard). Ils sont dans les SAN TLS ET dans le CN utilise par
  # l'indexer.
  indexer:
    - name: wazuh.indexer
      ip: wazuh.indexer
    - name: localhost
      ip: 127.0.0.1
  server:
    - name: wazuh.manager
      ip: wazuh.manager
  dashboard:
    - name: wazuh.dashboard
      ip: wazuh.dashboard
    - name: localhost
      ip: 127.0.0.1
