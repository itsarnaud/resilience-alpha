global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Les applis Node.js (prom-client, endpoint /metrics). Noms = noms de conteneurs réels.
  - job_name: applications
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth:3000
          - api:3000
          - remediation:3000

  - job_name: face
    static_configs:
      - targets: ["face:5000"]

  # --- Disponibilité + latence des machines du groupe (via blackbox, sans agent) ---
  - job_name: machines-ping
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["192.168.137.1"]
        labels: { machine: "hote" }
      # Décommenter et remplacer les IP :
      # - targets: ["192.168.137.XXX"]
      #   labels: { machine: "attaquant" }
      # - targets: ["192.168.137.YYY"]
      #   labels: { machine: "ia" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
