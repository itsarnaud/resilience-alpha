# Exclusion ciblee : le MFA back-office poste des images (base64) sur /api/auth.
# On passe ces requetes en DetectionOnly pour eviter les faux positifs CRS,
# sans toucher a la protection du reste du site.
SecRule REQUEST_URI "@beginsWith /api/auth" \
    "id:1100,phase:1,t:none,nolog,pass,ctl:ruleEngine=DetectionOnly"
