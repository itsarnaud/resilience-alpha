# Le MFA back-office envoie la photo du visage en image/jpeg brut sur l'etape
# /face du login. Le CRS la bloque (regle 920420 : content-type non autorise,
# score d'anomalie >= 5 -> 403). On passe tout le parcours de login back-office
# en DetectionOnly : les faux positifs sont journalises mais ne bloquent plus.
# Portee limitee a /auth/v1/backoffice/login/* ; le reste de /auth reste protege.
SecRule REQUEST_URI "@beginsWith /auth/v1/backoffice/login" \
    "id:1100,phase:1,t:none,nolog,pass,ctl:ruleEngine=DetectionOnly"
