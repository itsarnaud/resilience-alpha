# Le MFA back-office POST une image (base64 JSON) sur l'etape /face du login.
# Cette seule requete passe en DetectionOnly pour eviter les faux positifs CRS
# sur le payload base64. Tout le reste de /auth/* reste pleinement protege.
SecRule REQUEST_URI "@rx ^/auth/v1/backoffice/login/[^/]+/face" \
    "id:1100,phase:1,t:none,nolog,pass,ctl:ruleEngine=DetectionOnly"
