# Surcharge ModSecurity chargee via /etc/modsecurity.d/modsecurity-override.conf,
# inclus inconditionnellement par setup.conf AVANT les regles CRS. Portee limitee
# a des chemins precis ; tout le reste de /auth, /remediation... reste protege.

# --- 1) Upload d'image de visage (image/jpeg brut) : CRS 920420 bloque le
#         content-type. On passe ces 2 endpoints en DetectionOnly. ---
# Connexion back-office, etape visage : /auth/v1/backoffice/login/:id/face
SecRule REQUEST_URI "@beginsWith /auth/v1/backoffice/login" \
    "id:1100,phase:1,t:none,nolog,pass,ctl:ruleEngine=DetectionOnly"
# Enrolement d'un visage (Habilitations) : /auth/v1/admin/users/:id/face
SecRule REQUEST_URI "@rx ^/auth/v1/admin/users/[^/]+/face" \
    "id:1101,phase:1,t:none,nolog,pass,ctl:ruleEngine=DetectionOnly"

# --- 2) Methode DELETE sur /remediation/v1/blocks/:id (bouton "Debloquer" du
#         dashboard). CRS 911100 (METHOD-ENFORCEMENT) n'autorise que
#         GET/HEAD/POST/OPTIONS -> on retire cette seule regle pour ce chemin,
#         sans autoriser DELETE ailleurs. ---
SecRule REQUEST_URI "@beginsWith /remediation/v1/blocks" \
    "id:1102,phase:1,t:none,nolog,pass,ctl:ruleRemoveById=911100"
