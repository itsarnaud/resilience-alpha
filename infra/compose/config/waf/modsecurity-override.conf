# Surcharge ModSecurity chargee via /etc/modsecurity.d/modsecurity-override.conf,
# inclus inconditionnellement par setup.conf AVANT les regles CRS.
#
# Les deux endpoints qui recoivent une image de visage (image/jpeg brut) sont
# bloques par le CRS (regle 920420 : content-type non autorise -> 403). On les
# passe en DetectionOnly : les faux positifs sont journalises mais ne bloquent
# plus. Portee limitee a ces chemins ; tout le reste de /auth reste protege.

# 1) Connexion back-office, etape visage : /auth/v1/backoffice/login/:id/face
SecRule REQUEST_URI "@beginsWith /auth/v1/backoffice/login" \
    "id:1100,phase:1,t:none,nolog,pass,ctl:ruleEngine=DetectionOnly"

# 2) Enrolement d'un visage (Habilitations) : /auth/v1/admin/users/:id/face
SecRule REQUEST_URI "@rx ^/auth/v1/admin/users/[^/]+/face" \
    "id:1101,phase:1,t:none,nolog,pass,ctl:ruleEngine=DetectionOnly"
