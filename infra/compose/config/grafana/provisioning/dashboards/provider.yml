apiVersion: 1

providers:
  - name: resilience-alpha
    orgId: 1
    folder: Resilience-Alpha
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
