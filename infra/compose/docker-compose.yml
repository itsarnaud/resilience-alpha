# PROJECT RESILIENCE-ALPHA : infrastructure du workshop
# Lancement : docker compose up -d   (depuis ce dossier, après avoir rempli .env)

name: resilience-alpha

# Base commune aux 4 applications Node.js :
# chaque service monte son dossier apps/<nom> dans /app.
# Si le dossier contient un package.json -> npm install puis npm start.
# Sinon le conteneur reste allumé en attendant le code.
x-node-app: &node-app
  image: node:20-alpine
  working_dir: /app
  restart: unless-stopped
  command: >
    sh -c "if [ -f package.json ]; then npm install && npm start;
           else echo 'Pas de package.json dans /app : en attente du code'; tail -f /dev/null; fi"
  labels:
    logging: promtail
  networks: [backend]

services:

  # ---------- Entrée : WAF (Nginx + ModSecurity + règles OWASP CRS) ----------
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf
    restart: unless-stopped
    environment:
      BACKEND: http://application:3000   # tout le trafic passe par le WAF vers l'application
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"           # "DetectionOnly" pour seulement journaliser
      PARANOIA: "1"
    ports:
      - "80:8080"
    depends_on: [application]
    labels:
      logging: promtail
    networks: [frontend, backend]

  # ---------- Applications Node.js ----------
  application:
    <<: *node-app
    container_name: application
    volumes: [./apps/application:/app]
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@db-app:5432/${DB_APP_NAME}
      AUTH_URL: http://auth:3000
      PAIEMENT_URL: http://api-paiement:3000
    depends_on:
      db-app: { condition: service_healthy }
    networks: [backend, data]

  auth:
    <<: *node-app
    container_name: auth
    volumes: [./apps/auth:/app]
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${DB_AUTH_USER}:${DB_AUTH_PASSWORD}@db-auth:5432/${DB_AUTH_NAME}
    depends_on:
      db-auth: { condition: service_healthy }
    networks: [backend, data]

  api-paiement:
    <<: *node-app
    container_name: api-paiement
    volumes: [./apps/api-paiement:/app]
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${DB_PAIEMENT_USER}:${DB_PAIEMENT_PASSWORD}@db-paiement:5432/${DB_PAIEMENT_NAME}
    depends_on:
      db-paiement: { condition: service_healthy }
    networks: [backend, data]

  remediation:
    <<: *node-app
    container_name: remediation
    volumes: [./apps/remediation:/app]
    environment:
      PORT: "3000"
      PROMETHEUS_URL: http://prometheus:9090
      WAZUH_API_URL: https://wazuh-manager:55000
    networks: [backend, monitoring]

  # ---------- Bases de données PostgreSQL ----------
  db-app:
    image: postgres:16-alpine
    container_name: db-app
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_APP_USER}
      POSTGRES_PASSWORD: ${DB_APP_PASSWORD}
      POSTGRES_DB: ${DB_APP_NAME}
    volumes: [db_app_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks: [data]

  db-auth:
    image: postgres:16-alpine
    container_name: db-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_AUTH_USER}
      POSTGRES_PASSWORD: ${DB_AUTH_PASSWORD}
      POSTGRES_DB: ${DB_AUTH_NAME}
    volumes: [db_auth_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks: [data]

  db-paiement:
    image: postgres:16-alpine
    container_name: db-paiement
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_PAIEMENT_USER}
      POSTGRES_PASSWORD: ${DB_PAIEMENT_PASSWORD}
      POSTGRES_DB: ${DB_PAIEMENT_NAME}
    volumes: [db_paiement_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks: [data]

  # ---------- Observabilité : métriques ----------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [monitoring, backend]

  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    restart: unless-stopped
    networks: [monitoring]

  # ---------- Observabilité : logs ----------
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes: [loki_data:/loki]
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.4.2
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [monitoring]

  # ---------- Observabilité : tableaux de bord ----------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki]
    networks: [monitoring]

  # ---------- SIEM : Wazuh manager ----------
  wazuh-manager:
    image: wazuh/wazuh-manager:4.11.0
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    environment:
      API_USERNAME: ${WAZUH_API_USER}
      API_PASSWORD: ${WAZUH_API_PASSWORD}
    ports:
      - "1514:1514"     # communication avec les agents
      - "1515:1515"     # enrôlement des agents
      - "55000:55000"   # API Wazuh
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_api:/var/ossec/api/configuration
    networks: [monitoring, backend]

  # ---------- Automatisation : Ansible (nœud de contrôle) ----------
  # Utilisation : docker compose exec ansible ansible-playbook playbooks/<fichier>.yml
  ansible:
    build: ./ansible
    container_name: ansible
    restart: unless-stopped
    working_dir: /ansible
    volumes: [./ansible:/ansible]
    command: sleep infinity
    networks: [backend, monitoring]

networks:
  frontend:     # exposé : seul le WAF y est
  backend:      # applications entre elles
  data:         # applications <-> bases de données
  monitoring:   # Prometheus, Loki, Grafana, Wazuh

volumes:
  db_app_data:
  db_auth_data:
  db_paiement_data:
  prometheus_data:
  loki_data:
  grafana_data:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_api:
