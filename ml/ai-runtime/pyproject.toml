[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-alpha-ai"
version = "0.1.0"
description = "Local RAG and authentication anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf==2.0",
    "langchain-core==1.6.12",
    "langchain-text-splitters==1.1.3",
    "langchain-ollama==1.1.0",
    "httpx==0.28.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "fastapi==0.151.0",
    "uvicorn==0.54.0",
    "PyJWT[crypto]==2.15.1"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["resilience_alpha_ai*"]
namespaces = false
