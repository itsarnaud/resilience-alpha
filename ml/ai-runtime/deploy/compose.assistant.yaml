services:
  assistant-api:
    image: resilience-alpha-ai:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      AUTH_JWKS_URL: "${AUTH_JWKS_URL:?Set AUTH_JWKS_URL before starting}"
      JWT_ISSUER: resilience-auth
      JWT_AUDIENCE: resilience-platform
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_KNOWLEDGE_DIR: /app/data/knowledge_base
    volumes:
      - type: bind
        source: ../data/knowledge_base
        target: /app/data/knowledge_base
        read_only: true
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - uvicorn
      - resilience_alpha_ai.api.assistant:create_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
