# Sert l'application React compilée. Les appels `/api/*` et `/auth/*` n'arrivent jamais ici : ils sont
# aiguillés par le WAF vers l'API et vers auth.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Attention : un `add_header` dans un `location` remplace ceux du `server`. Les en-têtes de sécurité
  # sont donc uniquement ici, et les `location` n'en déclarent aucun (`expires` suffit pour le cache).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self' http://*:3000 http://*:8025; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Fichiers compilés : le nom contient une empreinte, ils peuvent être gardés longtemps.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Application monopage : toute autre adresse renvoie vers index.html (jamais mis en cache).
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
